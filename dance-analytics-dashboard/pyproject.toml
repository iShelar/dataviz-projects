[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dance-analytics"
version = "1.0.0"
description = "Interactive multi-view dashboard for exploring global dance-style datasets (Plotly Dash)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saurabh Shelar" }]
dependencies = [
    "dash==2.14.2",
    "pandas>=2.2.0,<3",
    "plotly==5.18.0",
    "numpy>=1.24.0,<3",
    "gunicorn==21.2.0",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9",
    "ruff>=0.4.0,<1",
]

[project.scripts]
dance-dashboard = "dance_analytics.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
